  background: linear-gradient(135deg, rgba(59, 130, 246, .3), rgba(168, 85, 247, .3));
  border: 1px solid rgba(147, 197, 253, .35);

  background: linear-gradient(160deg, rgba(30, 38, 90, .9), rgba(15, 20, 58, .9));
  border: 1px solid rgba(129, 140, 248, .18);
  transition: transform .2s, box-shadow .2s, border-color .2s;
}
.fq-tile:hover {
  transform: translateY(-2px);
  border-color: rgba(167, 139, 250, .5);
  box-shadow: 0 10px 24px -10px rgba(124, 58, 237, .6);
}
.fq-tile:active {
  transform: scale(.96);
}
.fq-lift {
  transition: transform .25s, box-shadow .25s, border-color .25s;
}
.fq-lift:hover {
  transform: translateY(-3px);
  border-color: rgba(167, 139, 250, .5);
  box-shadow: 0 24px 50px -20px rgba(124, 58, 237, .55);
}
.fq-hex {
  clip-path: polygon(50% 0, 93% 25%, 93% 75%, 50% 100%, 7% 75%, 7% 25%);
  background: radial-gradient(circle at 50% 35%, var(--c), #0b1030 80%);
  @supports (color: color-mix(in lab, red, red)) {
    background: radial-gradient(circle at 50% 35%, color-mix(in srgb, var(--c) 55%, #0b1030), #0b1030 80%);
  }
  box-shadow: inset 0 0 0 2px var(--c);
  filter: drop-shadow(0 0 10px var(--c));
  transition: transform .2s;
}
.fq-node:hover .fq-hex {
  transform: scale(1.1) rotate(-4deg);
}
.fq-island {
  border-radius: 40% 40% 48% 48%;
  background: radial-gradient(circle at 50% 30%, var(--c), transparent 70%);
  @supports (color: color-mix(in lab, red, red)) {
    background: radial-gradient(circle at 50% 30%, color-mix(in srgb, var(--c) 45%, transparent), transparent 70%);
  }
  filter: drop-shadow(0 6px 14px var(--c));
  @supports (color: color-mix(in lab, red, red)) {
    filter: drop-shadow(0 6px 14px color-mix(in srgb, var(--c) 60%, transparent));
  }
}
.fq-food-hero {
  background: radial-gradient(circle at 50% 40%, var(--g1), #0b1030 72%);
  @supports (color: color-mix(in lab, red, red)) {
    background: radial-gradient(circle at 50% 40%, color-mix(in srgb, var(--g1) 40%, #1e254f), #0b1030 72%);
  }
  box-shadow: 0 0 30px -6px var(--g1);
}
.fq-level-badge {
  background: linear-gradient(135deg, #7c3aed, #4f46e5 50%, #2563eb);
  box-shadow: 0 0 20px rgba(124, 58, 237, .7), inset 0 0 0 2px rgba(196, 181, 253, .6);
}
.fq-badge-got {
  background: linear-gradient(160deg, rgba(245, 158, 11, .2), rgba(124, 58, 237, .12));
  box-shadow: 0 0 20px -6px rgba(245, 158, 11, .6);
}
.fq-hero-next {
  background: radial-gradient(600px 240px at 0% 0%, rgba(34, 211, 238, .14), transparent 60%), linear-gradient(135deg, rgba(49, 22, 110, .95), rgba(14, 20, 62, .95) 55%, rgba(11, 16, 48, .95));
  border-color: rgba(167, 139, 250, .4);
}
.fq-journey-hero {
  background: radial-gradient(500px 200px at 100% 0%, rgba(245, 158, 11, .18), transparent 60%), linear-gradient(135deg, rgba(49, 22, 110, .95), rgba(11, 16, 48, .95));
}
.fq-stage-glow {
  position: absolute;
  inset: -40% -40% auto auto;
  width: 70%;
  height: 70%;
  border-radius: 9999px;
  background: var(--c);
  opacity: .14;
  filter: blur(40px);
}
.fq-fab {
  background: linear-gradient(135deg, #f59e0b, #fbbf24);
  color: #1a1203;
  box-shadow: 0 0 0 4px rgba(245, 158, 11, .2), 0 12px 30px -6px rgba(245, 158, 11, .7);
  transition: transform .2s;
}
.fq-fab:hover {
  transform: scale(1.06) rotate(90deg);
}
.fq-skel {
  background: linear-gradient(100deg, rgba(255, 255, 255, .04) 30%, rgba(255, 255, 255, .1) 50%, rgba(255, 255, 255, .04) 70%);
  background-size: 200% 100%;
  animation: fq-shimmer 1.3s linear infinite;
}
@keyframes fq-shimmer {
  to {
    background-position: -200% 0;
  }
}
.fq-enter {
  animation: fq-up .35s cubic-bezier(.2, .8, .2, 1);
}
.fq-sheet {
  animation: fq-up .3s cubic-bezier(.2, .8, .2, 1);
}
.fq-fade {
  animation: fq-fadein .2s ease;
}
.fq-toast {
  animation: fq-up .25s ease;
}
@keyframes fq-up {
  from {
    opacity: 0;
    transform: translateY(14px);
  }
  to {
    opacity: 1;
    transform: none;
  }
}
@keyframes fq-fadein {
  from {
    opacity: 0;
  }
}
.fq-float {
  animation: fq-float 5s ease-in-out infinite;
}
@keyframes fq-float {
  50% {
    transform: translateY(-6px) rotate(2deg);
  }
}
.fq-pulse {
  animation: fq-pulse 2s ease-in-out infinite;
}
@keyframes fq-pulse {
  50% {
    opacity: .3;
    r: 9;
  }
}
.fq-pop {
  animation: fq-pop .5s cubic-bezier(.2, 1.6, .4, 1);
}
@keyframes fq-pop {
  from {
    transform: scale(.6);
    opacity: 0;
  }
}
.fq-spin-slow {
  animation: fq-spin 40s linear infinite;
}
@keyframes fq-spin {
  to {
    transform: rotate(360deg);
  }
}
.fq-confetti {
  animation: fq-fall linear forwards;
}
@keyframes fq-fall {
  to {
    transform: translateY(110vh) rotate(540deg);
    opacity: .2;
  }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .001ms !important;
  }
}
